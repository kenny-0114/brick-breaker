<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Brick Tile v4 - Flat bricks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #2a2a3a;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  h1 { font-size: 20px; letter-spacing: 2px; }
  h2 { font-size: 14px; color: #aab; margin-bottom: 10px; }
  .section { background: #1a1a2e; border-radius: 12px; padding: 24px; max-width: 560px; width: 100%; }
  .tile-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .tile-card {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px;
  }
  .tile-card .label { font-size: 10px; color: #889; text-align: center; }

  .game-frame {
    width: 480px; background: #16163a; border-radius: 8px; overflow: hidden;
  }
  .game-ceiling { height: 4px; background: rgba(80,110,170,0.8); }
  .game-area {
    padding: 8px 4px;
    border-left: 4px solid rgba(80,110,170,0.8);
    border-right: 4px solid rgba(80,110,170,0.8);
  }
  .brick-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 2px; }
  .brick-cell { aspect-ratio: 1; position: relative; }
  .brick-cell svg { width: 100%; height: 100%; display: block; }
  .brick-cell .hp {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }
  .brick-cell.tri .hp { font-size: 10px; }
  .brick-cell.tri-tr .hp { justify-content: flex-end; padding-right: 16%; align-items: flex-start; padding-top: 14%; }
  .brick-cell.tri-tl .hp { justify-content: flex-start; padding-left: 16%; align-items: flex-start; padding-top: 14%; }
  .empty-cell { aspect-ratio: 1; }
</style>
</head>
<body>

<h1>BRICK TILE v4</h1>
<p style="color:#667; font-size:12px;">플랫 벽돌 + 줄눈 + 색상 변화 (입체감 제거)</p>

<!-- ===== SECTION 1: Base tile ===== -->
<div class="section">
  <h2>1. Base Tile (zoomed 2x)</h2>
  <div class="tile-row">
    <div class="tile-card">
      <svg width="140" height="140" viewBox="0 0 70 70">
        <rect width="70" height="70" fill="#d8d4cc"/>
        <rect x="-5" y="1" width="37" height="16" fill="#f0ece4"/>
        <rect x="34" y="1" width="37" height="16" fill="#e4ded4"/>
        <rect x="-22" y="19" width="37" height="16" fill="#ebe6dc"/>
        <rect x="17" y="19" width="37" height="16" fill="#f0ece4"/>
        <rect x="56" y="19" width="37" height="16" fill="#e2dcd2"/>
        <rect x="-5" y="37" width="37" height="16" fill="#e6e0d6"/>
        <rect x="34" y="37" width="37" height="16" fill="#f0ece4"/>
        <rect x="-22" y="55" width="37" height="16" fill="#f0ece4"/>
        <rect x="17" y="55" width="37" height="16" fill="#e4ded4"/>
        <rect x="56" y="55" width="37" height="16" fill="#ebe6dc"/>
      </svg>
      <div class="label">Flat bricks<br>mortar gaps + mixed shades</div>
    </div>
    <div class="tile-card" style="background:#16163a; padding:20px;">
      <svg width="140" height="140" viewBox="0 0 70 70">
        <rect width="70" height="70" fill="#d8d4cc"/>
        <rect x="-5" y="1" width="37" height="16" fill="#f0ece4"/>
        <rect x="34" y="1" width="37" height="16" fill="#e4ded4"/>
        <rect x="-22" y="19" width="37" height="16" fill="#ebe6dc"/>
        <rect x="17" y="19" width="37" height="16" fill="#f0ece4"/>
        <rect x="56" y="19" width="37" height="16" fill="#e2dcd2"/>
        <rect x="-5" y="37" width="37" height="16" fill="#e6e0d6"/>
        <rect x="34" y="37" width="37" height="16" fill="#f0ece4"/>
        <rect x="-22" y="55" width="37" height="16" fill="#f0ece4"/>
        <rect x="17" y="55" width="37" height="16" fill="#e4ded4"/>
        <rect x="56" y="55" width="37" height="16" fill="#ebe6dc"/>
      </svg>
      <div class="label">On dark background</div>
    </div>
  </div>
</div>

<!-- ===== SECTION 2: Colors ===== -->
<div class="section">
  <h2>2. HP Color Variants</h2>
  <div class="tile-row" id="colorTiles"></div>
</div>

<!-- ===== SECTION 3: Triangles ===== -->
<div class="section">
  <h2>3. Triangles</h2>
  <div class="tile-row" id="triTiles"></div>
</div>

<!-- ===== SECTION 4: Game Layout ===== -->
<div class="section">
  <h2>4. Game Layout (Level 2)</h2>
  <div class="game-frame">
    <div class="game-ceiling"></div>
    <div class="game-area">
      <div class="brick-grid" id="gameGrid"></div>
    </div>
  </div>
</div>

<script>
function darken(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.round(r*(1-amt)); g = Math.round(g*(1-amt)); b = Math.round(b*(1-amt));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function wallSVG(base, mortar) {
  const d1 = darken(base, 0.08);
  const d2 = darken(base, 0.04);
  return `<svg viewBox="0 0 70 70">
    <rect width="70" height="70" fill="${mortar}"/>
    <rect x="-5" y="1" width="37" height="16" fill="${base}"/>
    <rect x="34" y="1" width="37" height="16" fill="${d1}"/>
    <rect x="-22" y="19" width="37" height="16" fill="${d2}"/>
    <rect x="17" y="19" width="37" height="16" fill="${base}"/>
    <rect x="56" y="19" width="37" height="16" fill="${d1}"/>
    <rect x="-5" y="37" width="37" height="16" fill="${d1}"/>
    <rect x="34" y="37" width="37" height="16" fill="${base}"/>
    <rect x="-22" y="55" width="37" height="16" fill="${base}"/>
    <rect x="17" y="55" width="37" height="16" fill="${d1}"/>
    <rect x="56" y="55" width="37" height="16" fill="${d2}"/>
  </svg>`;
}

function triWallSVG(base, mortar, dir) {
  const d1 = darken(base, 0.08);
  const d2 = darken(base, 0.04);
  const clips = {2:"0,0 70,0 0,70", 3:"0,0 70,0 70,70"};
  const id = Math.random().toString(36).substr(2,5);
  return `<svg viewBox="0 0 70 70">
    <defs><clipPath id="tc${id}"><polygon points="${clips[dir]}"/></clipPath></defs>
    <g clip-path="url(#tc${id})">
      <rect width="70" height="70" fill="${mortar}"/>
      <rect x="-5" y="1" width="37" height="16" fill="${base}"/>
      <rect x="34" y="1" width="37" height="16" fill="${d1}"/>
      <rect x="-22" y="19" width="37" height="16" fill="${d2}"/>
      <rect x="17" y="19" width="37" height="16" fill="${base}"/>
      <rect x="56" y="19" width="37" height="16" fill="${d1}"/>
      <rect x="-5" y="37" width="37" height="16" fill="${d1}"/>
      <rect x="34" y="37" width="37" height="16" fill="${base}"/>
      <rect x="-22" y="55" width="37" height="16" fill="${base}"/>
      <rect x="17" y="55" width="37" height="16" fill="${d1}"/>
      <rect x="56" y="55" width="37" height="16" fill="${d2}"/>
    </g>
  </svg>`;
}

// [base, mortar]
const GREEN  = ['#8bc34a','#5a8525'];
const ORANGE = ['#f5a623','#b87808'];
const RED    = ['#e74c3c','#982520'];
const GREY   = ['#8a8a95','#505058'];

// Section 2: Color tiles
const colorEl = document.getElementById('colorTiles');
[['Green (1-10)',GREEN],['Orange (11-30)',ORANGE],['Red (31+)',RED],['Grey (INF)',GREY]].forEach(([name,c])=>{
  colorEl.innerHTML += `<div class="tile-card"><svg width="100" height="100" viewBox="0 0 70 70">${wallSVG(...c).replace(/<\/?svg[^>]*>/g,'')}</svg><div class="label">${name}</div></div>`;
});

// Section 3: Triangles
const triEl = document.getElementById('triTiles');
[[3,ORANGE,'◥ Dir 3'],[2,GREEN,'◤ Dir 2']].forEach(([dir,c,name])=>{
  triEl.innerHTML += `<div class="tile-card"><svg width="100" height="100" viewBox="0 0 70 70">${triWallSVG(c[0],c[1],dir).replace(/<\/?svg[^>]*>/g,'')}</svg><div class="label">${name}</div></div>`;
});

// Section 4: Game layout
const layout = [
  [null, null, [ORANGE,20,3], [RED,40], [ORANGE,20,2], null, null],
  [null, [GREEN,15,3], [ORANGE,30], [RED,35], [ORANGE,30], [GREEN,15,2], null],
  [[GREEN,10,3], [ORANGE,20], [ORANGE,25], [RED,30], [ORANGE,25], [ORANGE,20], [GREEN,10,2]],
  [[GREEN,15], [ORANGE,20], [ORANGE,25], [RED,30], [ORANGE,25], [ORANGE,20], [GREEN,15]],
  [null, [GREY,-1], null, null, null, [GREY,-1], null],
];

const grid = document.getElementById('gameGrid');
layout.forEach(row=>{
  row.forEach(cell=>{
    if(!cell){grid.innerHTML+='<div class="empty-cell"></div>';return;}
    const [colors,hp,triDir]=[cell[0],cell[1],cell[2]];
    const hpText = hp===-1?'INF':hp;
    if(triDir!==undefined){
      const cls=triDir===3?'tri-tr':'tri-tl';
      grid.innerHTML+=`<div class="brick-cell tri ${cls}">${triWallSVG(colors[0],colors[1],triDir)}<div class="hp">${hpText}</div></div>`;
    } else {
      grid.innerHTML+=`<div class="brick-cell">${wallSVG(colors[0],colors[1])}<div class="hp">${hpText}</div></div>`;
    }
  });
});
</script>

</body>
</html>
