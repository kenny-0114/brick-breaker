<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Item Box SVG Designs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 40px; }
  h1 { color: #f0c040; margin-bottom: 30px; }
  h2 { color: #88bbee; margin: 30px 0 15px; font-size: 18px; }
  .designs { display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start; }
  .design-card {
    background: rgba(255,255,255,0.05); border-radius: 8px; padding: 20px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .design-card .label { font-size: 13px; color: #aabbcc; }
  .size-row { display: flex; gap: 20px; align-items: flex-end; }
  .size-label { font-size: 11px; color: #667788; text-align: center; }

  /* 게임 배경 미리보기 */
  .preview-grid {
    display: grid; grid-template-columns: repeat(5, 48px); gap: 0;
    background: #16213e; padding: 4px; border-radius: 4px;
  }
  .preview-brick {
    width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; color: #fff; border-radius: 2px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .bg { background: linear-gradient(135deg, #5a8a3c, #4a7a2c); border: 1px solid #3a6a1c; }
  .bo { background: linear-gradient(135deg, #c8841e, #b87410); border: 1px solid #a86400; }
  .br { background: linear-gradient(135deg, #c83030, #a82020); border: 1px solid #881010; }
</style>
</head>
<body>

<h1>Item Box SVG Designs</h1>

<h2>Design A — Rounded Metal Frame + Glass</h2>
<div class="designs">
  <div class="design-card">
    <svg width="192" height="192" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <!-- 금속 프레임 배경 -->
      <rect x="0" y="0" width="48" height="48" rx="4" fill="#4a5568"/>
      <!-- 프레임 하이라이트 (위) -->
      <rect x="1" y="1" width="46" height="2" rx="1" fill="rgba(255,255,255,0.15)"/>
      <!-- 프레임 그림자 (아래) -->
      <rect x="1" y="45" width="46" height="2" rx="1" fill="rgba(0,0,0,0.3)"/>
      <!-- 내부 홈 -->
      <rect x="4" y="4" width="40" height="40" rx="3" fill="#2d3748"/>
      <!-- 유리 패널 -->
      <rect x="5" y="5" width="38" height="38" rx="2.5" fill="url(#glassA)"/>
      <!-- 유리 광택 -->
      <ellipse cx="16" cy="14" rx="10" ry="7" fill="rgba(255,255,255,0.12)"/>
      <!-- 코너 볼트 -->
      <circle cx="6" cy="6" r="2" fill="#718096" stroke="#2d3748" stroke-width="0.5"/>
      <circle cx="42" cy="6" r="2" fill="#718096" stroke="#2d3748" stroke-width="0.5"/>
      <circle cx="6" cy="42" r="2" fill="#718096" stroke="#2d3748" stroke-width="0.5"/>
      <circle cx="42" cy="42" r="2" fill="#718096" stroke="#2d3748" stroke-width="0.5"/>
      <!-- 미사일 (45도 회전) -->
      <g transform="translate(24, 22) rotate(45)">
        <!-- 미사일 몸체 -->
        <rect x="-3.5" y="-8" width="7" height="14" rx="2" fill="#a0aec0"/>
        <!-- 탄두 -->
        <polygon points="0,-12 -3.5,-8 3.5,-8" fill="#c53030"/>
        <!-- 탄두 하이라이트 -->
        <polygon points="0,-11 -1.5,-8.5 1.5,-8.5" fill="#e53e3e" opacity="0.6"/>
        <!-- 날개 -->
        <polygon points="-3.5,4 -6,7 -3.5,6" fill="#718096"/>
        <polygon points="3.5,4 6,7 3.5,6" fill="#718096"/>
        <!-- 몸체 디테일 -->
        <rect x="-2.5" y="-4" width="5" height="1" rx="0.5" fill="#718096"/>
        <rect x="-2.5" y="-1" width="5" height="1" rx="0.5" fill="#718096"/>
        <!-- 창문 -->
        <circle cx="0" cy="-5.5" r="1.2" fill="#63b3ed" opacity="0.8"/>
      </g>
      <!-- HP 텍스트 -->
      <text x="24" y="44" text-anchor="middle" font-size="7" font-weight="bold" fill="rgba(200,220,255,0.8)" font-family="sans-serif">15</text>
      <defs>
        <radialGradient id="glassA" cx="35%" cy="35%">
          <stop offset="0%" stop-color="rgba(130,190,255,0.3)"/>
          <stop offset="60%" stop-color="rgba(60,120,180,0.15)"/>
          <stop offset="100%" stop-color="rgba(30,60,100,0.35)"/>
        </radialGradient>
      </defs>
    </svg>
    <div class="label">A: 둥근 금속 + 유리</div>
  </div>

  <div class="design-card">
    <svg width="192" height="192" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <!-- 외부 프레임 -->
      <rect x="0" y="0" width="48" height="48" rx="2" fill="#4a5568"/>
      <rect x="1" y="1" width="46" height="46" rx="1.5" fill="#3a4558" stroke="#5a6a7a" stroke-width="0.5"/>
      <!-- 내부 베벨 -->
      <rect x="3" y="3" width="42" height="42" rx="2" fill="#2a3444" stroke="#1a2434" stroke-width="0.5"/>
      <!-- 유리 패널 -->
      <rect x="5" y="5" width="38" height="38" rx="1.5" fill="url(#glassB)"/>
      <!-- 유리 테두리 안쪽 빛 -->
      <rect x="5" y="5" width="38" height="38" rx="1.5" fill="none" stroke="rgba(150,200,255,0.2)" stroke-width="0.5"/>
      <!-- 대각선 광택 라인 -->
      <line x1="8" y1="5" x2="5" y2="8" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
      <line x1="14" y1="5" x2="5" y2="14" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
      <!-- 리벳 4개 -->
      <circle cx="3" cy="3" r="1.5" fill="#5a6a7a"/>
      <circle cx="45" cy="3" r="1.5" fill="#5a6a7a"/>
      <circle cx="3" cy="45" r="1.5" fill="#5a6a7a"/>
      <circle cx="45" cy="45" r="1.5" fill="#5a6a7a"/>
      <!-- 미사일 (45도) -->
      <g transform="translate(24, 22) rotate(45)">
        <rect x="-3.5" y="-8" width="7" height="14" rx="2" fill="#a0aec0"/>
        <polygon points="0,-12 -3.5,-8 3.5,-8" fill="#c53030"/>
        <polygon points="0,-11 -1.5,-8.5 1.5,-8.5" fill="#e53e3e" opacity="0.6"/>
        <polygon points="-3.5,4 -6,7 -3.5,6" fill="#718096"/>
        <polygon points="3.5,4 6,7 3.5,6" fill="#718096"/>
        <rect x="-2.5" y="-4" width="5" height="1" rx="0.5" fill="#718096"/>
        <rect x="-2.5" y="-1" width="5" height="1" rx="0.5" fill="#718096"/>
        <circle cx="0" cy="-5.5" r="1.2" fill="#63b3ed" opacity="0.8"/>
      </g>
      <text x="24" y="44" text-anchor="middle" font-size="7" font-weight="bold" fill="rgba(200,220,255,0.8)" font-family="sans-serif">15</text>
      <defs>
        <radialGradient id="glassB" cx="30%" cy="30%">
          <stop offset="0%" stop-color="rgba(120,180,240,0.25)"/>
          <stop offset="50%" stop-color="rgba(60,110,170,0.15)"/>
          <stop offset="100%" stop-color="rgba(25,50,90,0.4)"/>
        </radialGradient>
      </defs>
    </svg>
    <div class="label">B: 각진 금속 + 리벳</div>
  </div>

  <div class="design-card">
    <svg width="192" height="192" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <!-- 외부 프레임 — 두꺼운 금속 -->
      <rect x="0" y="0" width="48" height="48" rx="3" fill="#5a6a7a"/>
      <!-- 프레임 입체감 -->
      <rect x="0.5" y="0.5" width="47" height="1.5" rx="1" fill="rgba(255,255,255,0.12)"/>
      <rect x="0.5" y="46" width="47" height="1.5" rx="1" fill="rgba(0,0,0,0.25)"/>
      <!-- 내부 다크 홈 -->
      <rect x="4" y="4" width="40" height="40" rx="2" fill="#1a2634"/>
      <!-- 유리 — 좀 더 밝고 투명하게 -->
      <rect x="5" y="5" width="38" height="38" rx="1.5" fill="url(#glassC)"/>
      <!-- 유리 위 빛 반사 (커브) -->
      <path d="M8,8 Q24,6 38,12 L38,8 Q24,5 8,8 Z" fill="rgba(255,255,255,0.15)"/>
      <!-- 하단 미세 반사 -->
      <rect x="12" y="40" width="24" height="0.5" rx="0.25" fill="rgba(200,230,255,0.12)"/>
      <!-- 코너 나사 (슬롯) -->
      <g>
        <circle cx="5" cy="5" r="2" fill="#4a5a6a" stroke="#3a4a5a" stroke-width="0.3"/>
        <line x1="4" y1="5" x2="6" y2="5" stroke="#2a3a4a" stroke-width="0.6"/>
      </g>
      <g>
        <circle cx="43" cy="5" r="2" fill="#4a5a6a" stroke="#3a4a5a" stroke-width="0.3"/>
        <line x1="42" y1="5" x2="44" y2="5" stroke="#2a3a4a" stroke-width="0.6"/>
      </g>
      <g>
        <circle cx="5" cy="43" r="2" fill="#4a5a6a" stroke="#3a4a5a" stroke-width="0.3"/>
        <line x1="4" y1="43" x2="6" y2="43" stroke="#2a3a4a" stroke-width="0.6"/>
      </g>
      <g>
        <circle cx="43" cy="43" r="2" fill="#4a5a6a" stroke="#3a4a5a" stroke-width="0.3"/>
        <line x1="42" y1="43" x2="44" y2="43" stroke="#2a3a4a" stroke-width="0.6"/>
      </g>
      <!-- 미사일 (45도, 그림자 포함) -->
      <g transform="translate(24, 22) rotate(45)" filter="url(#missileShadow)">
        <rect x="-3.5" y="-8" width="7" height="14" rx="2" fill="#b0bec5"/>
        <rect x="-3.5" y="-8" width="7" height="3" rx="2" fill="#90a4ae"/>
        <polygon points="0,-12 -3.5,-8 3.5,-8" fill="#d32f2f"/>
        <polygon points="0,-11.5 -2,-8.5 2,-8.5" fill="#ef5350" opacity="0.5"/>
        <polygon points="-3.5,4 -6.5,7.5 -3.5,6" fill="#78909c"/>
        <polygon points="3.5,4 6.5,7.5 3.5,6" fill="#78909c"/>
        <rect x="-2.5" y="-3.5" width="5" height="0.8" rx="0.4" fill="#90a4ae"/>
        <rect x="-2.5" y="-1" width="5" height="0.8" rx="0.4" fill="#90a4ae"/>
        <circle cx="0" cy="-5.5" r="1.3" fill="#42a5f5" opacity="0.9"/>
        <circle cx="0" cy="-5.5" r="0.6" fill="#90caf9" opacity="0.6"/>
      </g>
      <!-- HP -->
      <text x="24" y="44.5" text-anchor="middle" font-size="7" font-weight="bold" fill="rgba(200,220,255,0.85)" font-family="sans-serif">15</text>
      <defs>
        <radialGradient id="glassC" cx="35%" cy="35%">
          <stop offset="0%" stop-color="rgba(140,200,255,0.3)"/>
          <stop offset="50%" stop-color="rgba(70,130,190,0.18)"/>
          <stop offset="100%" stop-color="rgba(20,50,90,0.45)"/>
        </radialGradient>
        <filter id="missileShadow">
          <feDropShadow dx="0.5" dy="0.5" stdDeviation="0.5" flood-color="rgba(0,0,0,0.3)"/>
        </filter>
      </defs>
    </svg>
    <div class="label">C: 나사 슬롯 + 입체 미사일</div>
  </div>
</div>
